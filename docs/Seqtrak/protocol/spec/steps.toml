[[message]]
id = "steps.note_add"
name = "Note add (synth / sampler)"
area = "steps"
kind = "parameter"
address = "72 g0 00"
data = "8 bytes: [tick hi] [tick lo] 00 [note] [vel] 00 [len hi] [len lo] (sampler note = 3C + pad − 1)"
dir = ["command", "report"]
status = "verified"
test = { skip = "action message: not requested by --probe, in case a request at an action address isn't harmless" }
meaning = "Add a note to the list. A note reaching the next note on the same pad/key removes it; the Seqtrak stops a sample when the note ends."
evidence = ["STEP-SEQUENCER §2 (SAMPLER, SYNTH 1)"]

[[message]]
id = "steps.param_lock"
name = "Parameter lock event (sampler)"
area = "steps"
kind = "parameter"
address = "72 g0 00"
data = "8 bytes: [tick hi] [tick lo] 03 [param H] [param M] [param L] [value] 00 — e.g. 03 41 1A 4F 4C 00 = pad 2 PITCH +12"
dir = ["command", "report"]
status = "verified"
test = { skip = "action message: not requested by --probe, in case a request at an action address isn't harmless" }
meaning = "A Parameter Lock (guide V1.20 §9.2) is an event in the same list as the notes: type byte 03 instead of 00 (note). The device writes each lock twice, at the step and 60 ticks (half a step) before it; it stores the address with the pad nibble moved (41 1A 4F is stored and read back as 41 10 4F). Read back with 75 g0 [index] and removed with 74 g0 [index] 00, like notes."
guide = "§9.2 (OS V1.20)"
evidence = ["Pi capture 2026-10-17 23:09 / 23:17: holding a SAMPLER step and turning PITCH sent 72 30 00 [tick] 03 41 1A 4F [value] 00 at the step and step − 60 ticks", "Pi write 2026-10-17: 72 30 00 07 7C / 08 38 + 03 41 1A 4F 4C 00 (step 10, +12) stored (read back 41 10 4F 4C) and Ace heard step 10 play an octave up", "Pi 2026-10-17 cleanup: 74 30 [index] 00 removed all 6 lock events and 4 notes (list read back empty)"]

