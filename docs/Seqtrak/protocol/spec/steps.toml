# Step data. Drum tracks = a fixed grid (70 xx); SYNTH 1/2, DX, SAMPLER = an ordered note list (72–76 g).
# t = drum track 0–6; g = group 00 SYNTH 1, 10 SYNTH 2, 20 DX, 30 SAMPLER. 120 ticks per step.

[[message]]
id = "steps.drum_add"
name = "Drum step add"
area = "steps"
kind = "parameter"
address = "70 0t 00"
data = "[step] [note] [vel] [len hi] [len lo] — e.g. [step] 3C 64 00 78"
dir = ["command", "report"]
status = "verified"
test = { skip = "action message: not requested by --probe, in case a request at an action address isn't harmless" }
meaning = "Turn a drum step on (the device sends the same when you enter a step). Acts on the MIDI-selected pattern."
guide = "§6.1"
evidence = ["STEP-SEQUENCER §1 (Dec 2025 + Oct 2026)", "Bridge step grid"]

[[message]]
id = "steps.drum_remove"
name = "Drum step remove"
area = "steps"
kind = "parameter"
address = "70 2t 00"
data = "[step] 0–127"
dir = ["command", "report"]
status = "verified"
test = { skip = "action message: not requested by --probe, in case a request at an action address isn't harmless" }
meaning = "Turn a drum step off. Acts on the MIDI-selected pattern."
evidence = ["STEP-SEQUENCER §1", "2026-10-15 PERC 2 pattern 2 cleared while selected over MIDI"]

[[message]]
id = "steps.drum_edit"
name = "Drum step edit (micro timing / velocity / substep / probability)"
area = "steps"
kind = "parameter"
address = "70 1t nn"
data = "nn = param; data [step] [value]. 00 micro timing: 60 + offset (−60…+59) · 01 velocity (1–127) · 03 substep: 00 none, 01 ×2, 04 ×3 8th triplet, 02 ×3 16th triplet, 03 ×4 · 04 probability: 00 = 100 % … 07 (8 levels; 01 = 87 %, 04 = 49 %, 07 = 10 %)"
dir = ["command", "report"]
status = "verified"
test = { skip = "action message: not requested by --probe, in case a request at an action address isn't harmless" }
meaning = "Edit one step. The device reports the same when you edit on its keys."
guide = "§6.3, §6.4, §6.6"
evidence = ["App 104-03", "2026-10-15 from the Pi on PERC 2: micro +30 → readback 5A, substep ×4 → 03, probability → 70 66 = 04 / 07", "2026-10-18 from the Mac on KICK step 16: 70 10 01 0F 50 → 70 40 0F read back velocity 80 (was 100); probability reads back at 70 6t [step]"]

[[message]]
id = "steps.drum_read"
name = "Drum step read"
area = "steps"
kind = "parameter"
address = "70 4t ss"
data = "reply: [note] [vel] [substep] [60 + micro] [len hi] [len lo]; no data = empty step. Live-recorded length = key hold time"
dir = ["readable"]
status = "verified"
test = { skip = "an empty step answers with no data bytes, so a read-only run on an empty pattern proves little; verified by step edits (STEP-SEQUENCER.md)" }
meaning = "Read one step of the MIDI-selected pattern."
evidence = ["STEP-SEQUENCER live recording section (2026-10-13)"]

[[message]]
id = "steps.drum_prob_read"
name = "Drum step probability"
area = "steps"
kind = "parameter"
address = "70 6t ss"
data = "1 byte: 00 = 100 % … 07; no reply for an empty step"
dir = ["readable"]
status = "verified"
test = { skip = "an empty step sends no reply; verified by probability edits on the Pi" }
meaning = "Probability of a step (not in the 70 4t readback)."
evidence = ["2026-10-15 from the Pi: set 04 / 07, read back 04 / 07"]

