# Bulk transfers. Request F0 43 20 7F 1C 0C [H M L] F7; reply pages
# F0 43 00 7F 1C [count hi lo] 0C [H M L] [total pages hi lo] [page hi lo] [data] [checksum] F7.
# The app acknowledges each page with a bulk message to 01 22 00 carrying [H M L] 00 [page] 00 00.

[[message]]
id = "bulk.official_blocks"
name = "Official bulk dumps (project / sound / sample)"
area = "bulk"
kind = "bulk"
address = "11 nn nn"
data = "Bulk Header 11 [mm] [nn] … Footer 12 [mm] [nn]; blocks per the Data List Bulk Dump Block table"
dir = ["command", "report"]
status = "official"
meaning = "Whole project, sound or sampler element as a dump."
evidence = ["Data List p. 120–121"]

[[message]]
id = "bulk.page_ack"
name = "Bulk page acknowledge"
area = "bulk"
kind = "bulk"
address = "01 22 00"
data = "[H M L of the dump] 00 [page] 00 00"
dir = ["command"]
status = "app"
meaning = "The app confirms each received page before the next is sent."
evidence = ["App P0-NAV, EX-18…20, 106-16"]

